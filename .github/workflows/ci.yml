# Continuous integration WITHOUT the game disc.
#
# No disc (or anything derived from one) may ever be put into CI. The game builds without one in
# the runtime-assets mode (docs/RUNTIME_ASSETS.md): stub assets/ headers from the decomp's config,
# the arrays read from the player's disc at start-up. What this workflow does:
#   lint          shell scripts (shellcheck, errors only), Python tools (byte-compile)
#   linux         the Linux build image (scripts/docker/Containerfile.linux), then Aurora, cos_sdk,
#                 the run harness and the header checks built with clang on x86_64 and aarch64
#                 (with the decomp's resource index enums only: gen_assets.sh --res-only), and
#                 the unit tests cos_sdk_smoke and cos_pc_tests run; then the game executable
#                 switchwaker itself with COS_RUNTIME_ASSETS=ON (gen_assets.sh --stubs)
#   switch-image  the Switch build images (scripts/switch/Containerfile.native and .mesa), built
#                 and kept in the GitHub Actions cache, so a later job (or a fork) starts warm
# Downloads (Aurora, Dawn and nod packages, SDL 3 ...) are cached across runs with actions/cache;
# images with the buildx GitHub Actions cache.
#
# Manual only (Actions tab, "Run workflow"): full retains the jobs below; network runs only the
# standalone Windows network tests without Aurora, SDK/game code or disc-derived data.
# The network scope also checks the copied remote-body asset bounds without those dependencies.
# windows-game compiles and links the Windows game from source-only runtime asset stubs.
# The local game regression (native/tools/regress.sh) still requires the player's disc.
# Optional build retention is off by default and carries no gameplay qualification.
name: ci

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Checks to run
        type: choice
        required: true
        default: full
        options:
          - full
          - network
          - windows-game
      retain_build:
        description: Retain game or owned-host build-only artifact for one day (public)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.scope || 'full' }}
  cancel-in-progress: true

jobs:
  lint:
    if: ${{ inputs.scope == 'full' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck (errors)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          git ls-files '*.sh' | xargs shellcheck -S error
      - name: Python tools byte-compile
        run: git ls-files '*.py' | xargs python3 -m py_compile
      - name: no disc-derived files tracked
        run: |
          if git ls-files | grep -Ei '\.(iso|gcm|rvz|dol|rel|gci|nro|nsp|elf)$'; then
            echo "files above must never be committed (CONTRIBUTING.md, 'No game data')"; exit 1
          fi

  linux:
    if: ${{ inputs.scope == 'full' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: scripts/docker
          file: scripts/docker/Containerfile.linux
          tags: centollos-linux-build:ci
          load: true
          cache-from: type=gha,scope=linux-${{ matrix.runner }}
          cache-to: type=gha,mode=max,scope=linux-${{ matrix.runner }}
      - name: Cache downloads
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            build/ci-linux/_deps/*-src
            build/ci-linux/_deps/*-subbuild
            ref/recompcore
            build/decomp-ci
          key: deps-${{ matrix.runner }}-${{ hashFiles('native/cmake/Aurora.cmake', 'native/patches/aurora/*.patch', 'native/tools/fetch_recompcore.sh', 'game/UPSTREAM') }}
          restore-keys: deps-${{ matrix.runner }}-
      # An older cache (restore-keys) has Aurora patched with another patch set, which
      # aurora_apply_patches.cmake refuses: fetch Aurora again, keep the other downloads.
      - name: Drop a stale Aurora tree
        if: steps.deps.outputs.cache-hit != 'true'
        run: rm -rf build/ci-linux/_deps/aurora-src build/ci-linux/_deps/aurora-subbuild
      - name: Build Aurora, cos_sdk and the harness (no disc, no game executable)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/work" -w /work \
              centollos-linux-build:ci bash -c '
            set -e
            native/tools/fetch_recompcore.sh /work/ref/recompcore
            # Only the decomp resource index enums (res/): no disc, no game data.
            native/tools/gen_assets.sh --res-only --decomp /work/build/decomp-ci --out /work/build/ci-res/GZLE01
            cmake -S native -B build/ci-linux -G Ninja -DCOS_ASSETS_DIR=/work/build/ci-res/GZLE01
            ninja -C build/ci-linux cos_sdk_smoke cos_pc_tests cos_scaffold_check cos_sdk_header_check \
                cos_sdk_shadow_check
            build/ci-linux/cos_sdk_smoke
            build/ci-linux/cos_pc_tests'
      - name: Build the game (runtime assets, no disc)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/work" -w /work \
              centollos-linux-build:ci bash -c '
            set -e
            # Stub assets/ headers: names, sizes and the disc locations of the arrays, no game data.
            native/tools/gen_assets.sh --stubs --decomp /work/build/decomp-ci --out /work/build/ci-stubs/GZLE01
            cmake -S native -B build/ci-linux-game -G Ninja -DCOS_RUNTIME_ASSETS=ON \
                -DCOS_ASSETS_DIR=/work/build/ci-stubs/GZLE01
            ninja -C build/ci-linux-game switchwaker'

  switch-image:
    if: ${{ inputs.scope == 'full' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Switch native build image
        uses: docker/build-push-action@v6
        with:
          context: scripts/switch
          file: scripts/switch/Containerfile.native
          tags: centollos-switch-native-build:ci
          cache-from: type=gha,scope=switch-native
          cache-to: type=gha,mode=max,scope=switch-native
      - name: Switch Mesa build image
        uses: docker/build-push-action@v6
        with:
          context: scripts/switch
          file: scripts/switch/Containerfile.mesa
          tags: centollos-switch-mesa-build:ci
          cache-from: type=gha,scope=switch-mesa
          cache-to: type=gha,mode=max,scope=switch-mesa

  network:
    if: ${{ inputs.scope == 'network' }}
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and test standalone network foundations
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Assert-FreeSpace {
            $roots = @([IO.Path]::GetPathRoot($env:SystemRoot),
                       [IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE)) | Sort-Object -Unique
            foreach ($root in $roots) {
              $drive = Get-PSDrive -Name $root.Substring(0, 1)
              if ($drive.Free -lt 8GB) { throw "At least 8 GiB free is required on $root" }
            }
          }
          Assert-FreeSpace
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$vs) { throw 'Visual Studio C++ tools were not found' }
          $vcvars = Join-Path $vs 'VC/Auxiliary/Build/vcvars64.bat'
          $clang = Join-Path $vs 'VC/Tools/Llvm/x64/bin/clang-cl.exe'
          $linker = Join-Path $vs 'VC/Tools/Llvm/x64/bin/lld-link.exe'
          foreach ($tool in @($vcvars, $clang, $linker)) {
            if (!(Test-Path -LiteralPath $tool -PathType Leaf)) { throw "Missing tool: $tool" }
          }
          $bootstrap = Join-Path $env:RUNNER_TEMP 'network-msvc.cmd'
          [IO.File]::WriteAllText($bootstrap,
            "@echo off`r`ncall `"$vcvars`" >nul`r`nif errorlevel 1 exit /b 1`r`nset`r`n")
          # Capture internally; never print the runner's complete environment.
          $environment = @(& $env:ComSpec /d /c $bootstrap)
          if ($LASTEXITCODE -ne 0) { throw 'MSVC environment initialization failed' }
          foreach ($line in $environment) {
            if ($line -match '^(Path|INCLUDE|LIB|LIBPATH)=(.*)$') {
              [Environment]::SetEnvironmentVariable($Matches[1], $Matches[2], 'Process')
            }
          }
          & $clang --version
          if ($LASTEXITCODE -ne 0) { throw 'clang-cl is unavailable' }
          cmake -S native/check/network -B build/ci-network -G Ninja -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_CXX_COMPILER=$clang" "-DCMAKE_LINKER=$linker"
          if ($LASTEXITCODE -ne 0) { throw 'Standalone network configure failed' }
          Assert-FreeSpace
          cmake --build build/ci-network --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Standalone network build failed' }
          Assert-FreeSpace
          ctest --test-dir build/ci-network --output-on-failure --timeout 300 --parallel 2 --no-tests=error
          if ($LASTEXITCODE -ne 0) {
            # Synthetic fixtures only; retain them on the runner and show metadata, not contents.
            Get-ChildItem -LiteralPath 'build/ci-network/fixtures' -File -Recurse |
              Select-Object -First 100 FullName, Length, LastWriteTimeUtc | Format-Table -AutoSize
            throw 'Standalone network tests failed'
          }
          Assert-FreeSpace
          cmake -S native/check/remote_body -B build/ci-remote-body -G Ninja -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_CXX_COMPILER=$clang" "-DCMAKE_LINKER=$linker"
          if ($LASTEXITCODE -ne 0) { throw 'Standalone remote-body asset configure failed' }
          Assert-FreeSpace
          cmake --build build/ci-remote-body --target cos_remote_body_asset_tests cos_network_body_policy_tests --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Standalone remote-body asset build failed' }
          Assert-FreeSpace
          ctest --test-dir build/ci-remote-body --output-on-failure --timeout 60 --no-tests=error -R "^(remote_body_assets|network_body_policy)$"
          if ($LASTEXITCODE -ne 0) { throw 'Standalone remote-body asset checks failed' }
      - name: Stage explicitly requested owned host helper
        if: ${{ success() && inputs.retain_build }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = 'build/ci-network-helper'
          if (Test-Path -LiteralPath $stage) { throw 'Helper staging directory already exists' }
          New-Item -ItemType Directory -Path $stage | Out-Null
          $inputs = @(
            @{ source = 'build/ci-network/cos_network_server.exe'; name = 'cos_network_server.exe' },
            @{ source = 'native/src/pc/network/COPYING'; name = 'COPYING' },
            @{ source = 'native/src/pc/network/PROVENANCE.md'; name = 'PROVENANCE.md' },
            @{ source = 'LICENSE'; name = 'LICENSE' }
          )
          $records = foreach ($item in $inputs) {
            $file = Get-Item -LiteralPath $item.source
            if ($file.Length -le 0 -or $file.Length -gt 8MB -or
                ($file.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
              throw "Unsafe helper input: $($item.source)"
            }
            $destination = Join-Path $stage $item.name
            Copy-Item -LiteralPath $file.FullName -Destination $destination
            @{ path = $item.name; bytes = $file.Length;
               sha256 = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant() }
          }
          $protocolLine = Select-String -LiteralPath 'native/include/pc/network/network_session.h' -Pattern '^#define PC_NETWORK_PROTOCOL ([0-9]+)u$'
          if (!$protocolLine -or $protocolLine.Matches.Count -ne 1) { throw 'Missing helper wire protocol' }
          $manifest = @{
            format_version = 1; kind = 'network-helper-build-only'; gameplay_qualified = $false;
            source_commit = $env:GITHUB_SHA; source_repository = $env:GITHUB_REPOSITORY;
            workflow_run = $env:GITHUB_RUN_ID; wire_protocol = [int]$protocolLine.Matches[0].Groups[1].Value;
            files = @($records)
          }
          [IO.File]::WriteAllText((Join-Path $stage 'manifest.json'),
            ($manifest | ConvertTo-Json -Depth 5), [Text.UTF8Encoding]::new($false))
      - name: Retain explicitly requested owned host helper
        if: ${{ success() && inputs.retain_build }}
        uses: actions/upload-artifact@v4
        with:
          name: network-helper-${{ github.sha }}
          path: build/ci-network-helper/*
          if-no-files-found: error
          retention-days: 1

  windows-game:
    if: ${{ inputs.scope == 'windows-game' }}
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Compile and link Windows game without disc data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Assert-FreeSpace {
            $roots = @([IO.Path]::GetPathRoot($env:SystemRoot),
                       [IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE)) | Sort-Object -Unique
            foreach ($root in $roots) {
              $drive = Get-PSDrive -Name $root.Substring(0, 1)
              if ($drive.Free -lt 8GB) { throw "At least 8 GiB free is required on $root" }
            }
          }
          Assert-FreeSpace
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$vs) { throw 'Visual Studio C++ tools were not found' }
          $vcvars = Join-Path $vs 'VC/Auxiliary/Build/vcvars64.bat'
          $clang = Join-Path $vs 'VC/Tools/Llvm/x64/bin/clang-cl.exe'
          $linker = Join-Path $vs 'VC/Tools/Llvm/x64/bin/lld-link.exe'
          foreach ($tool in @($vcvars, $clang, $linker)) {
            if (!(Test-Path -LiteralPath $tool -PathType Leaf)) { throw "Missing tool: $tool" }
          }
          $bootstrap = Join-Path $env:RUNNER_TEMP 'windows-game-msvc.cmd'
          [IO.File]::WriteAllText($bootstrap,
            "@echo off`r`ncall `"$vcvars`" >nul`r`nif errorlevel 1 exit /b 1`r`nset`r`n")
          # Import only compiler paths; never print the runner's complete environment.
          $environment = @(& $env:ComSpec /d /c $bootstrap)
          if ($LASTEXITCODE -ne 0) { throw 'MSVC environment initialization failed' }
          foreach ($line in $environment) {
            if ($line -match '^(Path|INCLUDE|LIB|LIBPATH)=(.*)$') {
              [Environment]::SetEnvironmentVariable($Matches[1], $Matches[2], 'Process')
            }
          }
          & $clang --version
          if ($LASTEXITCODE -ne 0) { throw 'clang-cl is unavailable' }
          cmake --version
          if ($LASTEXITCODE -ne 0) { throw 'CMake is unavailable (3.28 or newer required)' }
          ninja --version
          if ($LASTEXITCODE -ne 0) { throw 'Ninja is unavailable' }
          python -c "import sys; assert sys.version_info >= (3, 10); print(sys.version)"
          if ($LASTEXITCODE -ne 0) { throw 'Python 3.10 or newer is required' }
          # Verified release and Windows wheels: https://pypi.org/project/PyYAML/6.0.3/
          python -m pip install --disable-pip-version-check --only-binary=:all: PyYAML==6.0.3
          if ($LASTEXITCODE -ne 0) { throw 'Pinned PyYAML installation failed' }
          python native/tools/fetch_recompcore.py
          if ($LASTEXITCODE -ne 0) { throw 'Pinned RecompCore preparation failed' }
          python native/tools/gen_assets.py --stubs --decomp build/ci-decomp --out build/ci-win-game/assets/GZLE01
          if ($LASTEXITCODE -ne 0) { throw 'Source-only asset stub preparation failed' }
          Assert-FreeSpace
          cmake -S native -B build/ci-win-game -G Ninja -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_C_COMPILER=$clang" "-DCMAKE_CXX_COMPILER=$clang" "-DCMAKE_LINKER=$linker" `
            -DCOS_RUNTIME_ASSETS=ON "-DCOS_ASSETS_DIR=$env:GITHUB_WORKSPACE/build/ci-win-game/assets/GZLE01" `
            -DAURORA_DAWN_PROVIDER=package -DAURORA_NOD_PROVIDER=package -DAURORA_SDL3_PROVIDER=package `
            -DTRACY_ENABLE=OFF
          if ($LASTEXITCODE -ne 0) { throw 'Windows runtime-assets configure failed' }
          Assert-FreeSpace
          cmake --build build/ci-win-game --target switchwaker cos_pc_tests cos_sdk_smoke cos_windows_long_paths cos_remote_body_asset_tests cos_network_body_policy_tests --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Windows game compile/link failed' }
          $binary = Get-Item -LiteralPath 'build/ci-win-game/switchwaker.exe'
          if ($binary.Length -eq 0) { throw 'Linked game executable is empty' }
          $hash = (Get-FileHash -LiteralPath $binary.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output ("Compile/link output: switchwaker.exe bytes={0} sha256={1}" -f $binary.Length, $hash)
          Assert-FreeSpace
          # These helper programs need no disc, game window or GPU. This is not gameplay proof.
          & './build/ci-win-game/cos_pc_tests.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Native PC helper tests failed' }
          & './build/ci-win-game/cos_sdk_smoke.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Headless SDK smoke tests failed' }
          & './build/ci-win-game/cos_remote_body_asset_tests.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Remote-body asset bounds failed' }
          & './build/ci-win-game/cos_network_body_policy_tests.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Network-body copied policy checks failed' }
          & './build/ci-win-game/cos_windows_long_paths.exe' --root "$env:GITHUB_WORKSPACE/build/ci-win-game/long-path-fixture"
          if ($LASTEXITCODE -ne 0) { throw 'Windows long-path helper failed' }
      - name: Stage explicitly requested build-only files
        if: ${{ success() && inputs.scope == 'windows-game' && inputs.retain_build }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = (Resolve-Path -LiteralPath $env:GITHUB_WORKSPACE).ProviderPath.TrimEnd('\')
          $workspacePrefix = $workspace + '\'
          function Resolve-OwnedPath([string] $path) {
            $resolved = (Resolve-Path -LiteralPath $path).ProviderPath
            if ($resolved -ne $workspace -and
                !$resolved.StartsWith($workspacePrefix, [StringComparison]::OrdinalIgnoreCase)) {
              throw 'Build retention path escapes the workspace'
            }
            $cursor = $resolved
            while ($true) {
              $node = Get-Item -LiteralPath $cursor -Force
              if ($node.Attributes -band [IO.FileAttributes]::ReparsePoint) {
                throw 'Build retention refuses linked paths'
              }
              if ($cursor -eq $workspace) { break }
              $cursor = [IO.Path]::GetDirectoryName($cursor)
              if (!$cursor) { throw 'Build retention path has no workspace ancestor' }
            }
            return $resolved
          }
          $build = Resolve-OwnedPath (Join-Path $workspace 'build/ci-win-game')
          $source = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $source -notmatch '^[0-9a-f]{40}$' -or $source -ne $env:GITHUB_SHA) {
            throw 'Build retention source commit does not match the workflow commit'
          }
          $exe = Get-Item -LiteralPath (Join-Path $build 'switchwaker.exe')
          $dlls = @(Get-ChildItem -LiteralPath $build -File -Filter '*.dll')
          if ($dlls.Count -eq 0) { throw 'No post-build runtime DLLs were found' }
          $files = @($exe) + $dlls
          $total = [int64] 0
          foreach ($file in $files) {
            $resolved = Resolve-OwnedPath $file.FullName
            if ($file.PSIsContainer -or [IO.Path]::GetDirectoryName($resolved) -ne $build -or $file.Length -le 0) {
              throw 'Build retention accepts only nonempty top-level EXE/runtime DLL files'
            }
            $stream = [IO.File]::OpenRead($resolved)
            try {
              if ($stream.ReadByte() -ne 0x4d -or $stream.ReadByte() -ne 0x5a) {
                throw 'Build retention input is not a PE executable or library'
              }
            } finally { $stream.Dispose() }
            $total += $file.Length
          }
          if ($total -gt 256MB) { throw 'Build-only files exceed the 256 MiB limit' }
          $stage = Join-Path $build ("build-only-" + $source)
          if (Test-Path -LiteralPath $stage) { throw 'Build-only staging directory must be fresh' }
          [void] [IO.Directory]::CreateDirectory($stage)
          $stage = Resolve-OwnedPath $stage
          $records = @()
          foreach ($file in $files) {
            $sourceHash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $destination = Join-Path $stage $file.Name
            Copy-Item -LiteralPath $file.FullName -Destination $destination
            $copy = Get-Item -LiteralPath (Resolve-OwnedPath $destination)
            $copyHash = (Get-FileHash -LiteralPath $copy.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($copy.Length -ne $file.Length -or $copyHash -ne $sourceHash) {
              throw 'Build-only staging hash or size mismatch'
            }
            $records += [ordered] @{ name = $file.Name; bytes = $copy.Length; sha256 = $copyHash;
              component = 'windows-runtime'; source_path = "build/ci-win-game/$($file.Name)" }
          }
          # Retain actual credited texts byte-for-byte, not source trees or asset directories.
          $licenseBytes = [int64] 0
          function Hash-Bytes([byte[]] $bytes) {
            $sha = [Security.Cryptography.SHA256]::Create()
            try { return [BitConverter]::ToString($sha.ComputeHash($bytes)).Replace('-', '').ToLowerInvariant() }
            finally { $sha.Dispose() }
          }
          function Add-LicenseBytes([byte[]] $bytes, [string] $relative, [string] $component, [hashtable] $origin) {
            if (!$bytes.Length -or $bytes.Length -gt 1MB -or $bytes -contains 0) { throw 'Invalid or oversized license text' }
            [void] [Text.UTF8Encoding]::new($false, $true).GetString($bytes)
            $script:licenseBytes += $bytes.Length
            if ($script:licenseBytes -gt 8MB) { throw 'License texts exceed the 8 MiB limit' }
            $hash = Hash-Bytes $bytes
            if ($origin.ContainsKey('expected_sha256') -and $hash -ne $origin.expected_sha256) {
              throw 'Pinned primary license hash mismatch'
            }
            $destination = [IO.Path]::GetFullPath((Join-Path $stage $relative))
            if (!$destination.StartsWith($stage + '\', [StringComparison]::OrdinalIgnoreCase)) {
              throw 'License destination escapes build-only staging'
            }
            if (Test-Path -LiteralPath $destination) { throw 'License destination must be fresh' }
            [void] [IO.Directory]::CreateDirectory([IO.Path]::GetDirectoryName($destination))
            [void] (Resolve-OwnedPath ([IO.Path]::GetDirectoryName($destination)))
            [IO.File]::WriteAllBytes($destination, $bytes)
            if ((Get-FileHash -LiteralPath (Resolve-OwnedPath $destination) -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hash) {
              throw 'Retained license hash mismatch'
            }
            $entry = [ordered] @{ name = $relative.Replace('\', '/'); bytes = $bytes.Length;
              sha256 = $hash; component = $component; source_sha256 = $hash }
            foreach ($key in $origin.Keys) { $entry[$key] = $origin[$key] }
            $script:records += $entry
          }
          function Add-LicenseFile([string] $path, [string] $relative, [string] $component) {
            $path = Resolve-OwnedPath $path
            if ((Get-Item -LiteralPath $path).Length -gt 1MB) { throw 'License text exceeds 1 MiB' }
            Add-LicenseBytes ([IO.File]::ReadAllBytes($path)) $relative $component @{
              source_path = [IO.Path]::GetRelativePath($workspace, $path).Replace('\', '/') }
          }
          $licenseRoots = [ordered] @{
            project = '.'; game = 'game'; 'dsp-adapter' = 'native/dsp_hle';
            recompcore = 'ref/recompcore'; 'native-network' = 'native/src/pc/network'
          }
          $dependencyRoots = [ordered] @{
            aurora = 'aurora-src'; dawn = 'dawn_prebuilt-src'; nod = 'nod_prebuilt-src'; SDL = 'sdl3_prebuilt-src';
            zlib = 'zlib-src'; png = 'png-src'; abseil = 'abseil-cpp-src'; fmt = 'fmt-src';
            freetype = 'freetype-src'; imgui = 'imgui-src'; sqlite = 'sqlite3-src'; tracy = 'tracy-src';
            xxhash = 'xxhash-src'; zstd = 'zstd-src'
          }
          foreach ($label in $dependencyRoots.Keys) {
            $licenseRoots[$label] = 'build/ci-win-game/_deps/' + $dependencyRoots[$label]
          }
          $localLicenseCounts = @{}
          foreach ($label in $licenseRoots.Keys) {
            $root = Resolve-OwnedPath (Join-Path $workspace $licenseRoots[$label])
            $candidates = if ($label -in @('dawn', 'nod', 'SDL')) {
              Get-ChildItem -LiteralPath $root -File -Recurse
            } else { Get-ChildItem -LiteralPath $root -File }
            $candidates = @($candidates | Where-Object Name -Match '^(LICENSE|COPYING|NOTICE|PROVENANCE)' | Sort-Object FullName)
            $localLicenseCounts[$label] = $candidates.Count
            if ($label -in @('project', 'game', 'dsp-adapter', 'recompcore', 'native-network') -and !$candidates.Count) {
              throw "Required component license text is missing: $label"
            }
            foreach ($file in $candidates) {
              $relative = [IO.Path]::GetRelativePath($root, $file.FullName).Replace('\', '/')
              Add-LicenseFile $file.FullName ("licenses/$label/$relative") $label
            }
          }
          foreach ($name in @('FTL.TXT', 'GPLv2.TXT')) {
            Add-LicenseFile (Join-Path $build "_deps/freetype-src/docs/$name") "licenses/freetype/docs/$name" 'freetype'
          }
          foreach ($required in @('licenses/project/LICENSE', 'licenses/game/LICENSE', 'licenses/dsp-adapter/LICENSE',
              'licenses/recompcore/COPYING', 'licenses/native-network/COPYING', 'licenses/native-network/PROVENANCE.md')) {
            if ($required -notin @($records | ForEach-Object { $_.name })) { throw "Required license/provenance text missing: $required" }
          }
          # SQLite supplies this public-domain notice in its header, not a standalone license file.
          $sqlite = Resolve-OwnedPath (Join-Path $build '_deps/sqlite3-src/sqlite3.h')
          if ((Get-Item -LiteralPath $sqlite).Length -gt 4MB) { throw 'Unexpected SQLite notice source size' }
          $header = [IO.File]::ReadAllBytes($sqlite)
          $headerText = [Text.Encoding]::UTF8.GetString($header)
          $end = $headerText.IndexOf('*/') + 2
          if (!$headerText.StartsWith('/*') -or $end -lt 2 -or
              !$headerText.Substring(0, $end).Contains('The author disclaims copyright to this source code.')) {
            throw 'SQLite initial license comment did not match'
          }
          $noticeLength = [Text.Encoding]::UTF8.GetByteCount($headerText.Substring(0, $end))
          $notice = [byte[]]::new($noticeLength)
          [Array]::Copy($header, $notice, $noticeLength)
          Add-LicenseBytes $notice 'licenses/sqlite/PUBLIC-DOMAIN.txt' 'sqlite' @{
            source_path = 'build/ci-win-game/_deps/sqlite3-src/sqlite3.h'; source_sha256 = (Hash-Bytes $header);
            source_slice = @{ offset = 0; bytes = $noticeLength; description = 'Unmodified initial block comment' }
          }
          # The pinned Dawn/nod binary packages omit standalone license texts. Only these
          # reviewed primary-source URLs may supply a missing component's fallback notices.
          $fallbacks = @(
            @{ component = 'dawn'; name = 'LICENSE';
              url = 'https://raw.githubusercontent.com/encounter/dawn/1155e0ed531126f33a1279afa029349651ca1c93/LICENSE';
              sha256 = '0493f897193af1796d5054659f45ec7d4c5af648fa67a99f01d30e55cc805abc' },
            @{ component = 'nod'; name = 'LICENSE-APACHE';
              url = 'https://raw.githubusercontent.com/encounter/nod/v2.0.0-alpha.12/LICENSE-APACHE';
              sha256 = 'fd363f1eb5135402a2e66f4a6173e6eff06daabe79d150acd7c669d33b985b4e' },
            @{ component = 'nod'; name = 'LICENSE-MIT';
              url = 'https://raw.githubusercontent.com/encounter/nod/v2.0.0-alpha.12/LICENSE-MIT';
              sha256 = '544ffe9befaefa6b59ab1fdde58789069ba7c1b65432bdea273a16b2117909b7' }
          )
          $http = [Net.Http.HttpClient]::new()
          $http.Timeout = [TimeSpan]::FromSeconds(30)
          $http.MaxResponseContentBufferSize = 1MB
          try {
            foreach ($fallback in $fallbacks) {
              if ($localLicenseCounts[$fallback.component]) { continue }
              $response = $http.GetAsync($fallback.url).GetAwaiter().GetResult()
              try {
                [void] $response.EnsureSuccessStatusCode()
                $bytes = $response.Content.ReadAsByteArrayAsync().GetAwaiter().GetResult()
                Add-LicenseBytes $bytes ("licenses/" + $fallback.component + '/' + $fallback.name) $fallback.component @{
                  source_url = $fallback.url; expected_sha256 = $fallback.sha256 }
              } finally { $response.Dispose() }
            }
          } finally { $http.Dispose() }
          $licenseSources = @()
          foreach ($label in $licenseRoots.Keys) {
            $licenseSources += [ordered] @{ component = $label; source_root = $licenseRoots[$label];
              retained_files = @($records | Where-Object { $_.component -eq $label }).Count }
          }
          $manifest = [ordered] @{
            kind = 'build-only'
            source_repository = $env:GITHUB_REPOSITORY
            source_commit = $source
            build_mode = 'runtime-assets'
            configuration = 'Release'
            qualification = 'compile-link-and-headless-helper-tests-only'
            gameplay_qualified = $false
            license_scope = 'Retained credited license/provenance texts; no legal clearance claim'
            license_sources = $licenseSources
            created_utc = [DateTime]::UtcNow.ToString('o')
            files = $records
          } | ConvertTo-Json -Depth 5
          if ([Text.Encoding]::UTF8.GetByteCount($manifest) -gt 64KB) { throw 'Build provenance manifest is too large' }
          [IO.File]::WriteAllText((Join-Path $stage 'build-provenance.json'), $manifest, [Text.UTF8Encoding]::new($false))
          $staged = @(Get-ChildItem -LiteralPath $stage -Force -File -Recurse)
          $expectedNames = @($records | ForEach-Object { $_.name }) + 'build-provenance.json'
          $actualNames = @($staged | ForEach-Object { [IO.Path]::GetRelativePath($stage, $_.FullName).Replace('\', '/') })
          if (@(Compare-Object $expectedNames $actualNames).Count -ne 0) {
            throw 'Unexpected build-only staging contents'
          }
          foreach ($node in Get-ChildItem -LiteralPath $stage -Force -Recurse) {
            [void] (Resolve-OwnedPath $node.FullName)
            if ($node.PSIsContainer -and $node.FullName -ne (Join-Path $stage 'licenses') -and
                !$node.FullName.StartsWith((Join-Path $stage 'licenses') + '\', [StringComparison]::OrdinalIgnoreCase)) {
              throw 'Unexpected build-only staging directory'
            }
          }
          if (($staged | Measure-Object -Property Length -Sum).Sum -gt 256MB) {
            throw 'Build-only artifact including provenance exceeds 256 MiB'
          }
          Write-Output ("Build-only retention: files={0} bytes={1}; gameplay remains unqualified" -f
            $staged.Count, ($staged | Measure-Object -Property Length -Sum).Sum)
      - name: Retain explicitly requested build-only artifact
        if: ${{ success() && inputs.scope == 'windows-game' && inputs.retain_build }}
        uses: actions/upload-artifact@v4
        with:
          name: build-only-${{ github.sha }}
          path: build/ci-win-game/build-only-${{ github.sha }}/
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
